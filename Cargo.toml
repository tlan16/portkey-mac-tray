[package]
name = "my-mac-tray"
version = "0.2.0"
edition = "2024"

[lib]
name = "my_mac_tray"
path = "src/lib.rs"

[[bin]]
name = "my-mac-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.24.1"
winit = "0.30.13"
chrono = "0.4.45"
tokio = { version = "1.43", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
keyring = "4.2.0"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile)
panic = "abort"      # Remove panic unwinding
strip = "symbols"    # Strip all symbols
