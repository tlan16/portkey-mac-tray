[package]
name = "my-mac-tray"
version = "0.1.0"
edition = "2024"

[lib]
name = "my_mac_tray"
path = "src/lib.rs"

[[bin]]
name = "my-mac-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.24.1"
winit = "0.30.13"
chrono = "0.4.45"
dotenvy = "0.15"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.138"
spider = { version = "2", features = ["chrome_headed"] }
